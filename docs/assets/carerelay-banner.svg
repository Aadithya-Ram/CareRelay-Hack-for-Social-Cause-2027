    <path d="M13 24C13 14 24 12 28 20C33 12 44 15 43 25C42 33 28 42 28 42S14 33 13 24Z" fill="none" stroke="#315347" stroke-width="2.7"/>
    <path d="M16 28H23L26 22L30 33L33 28H40" fill="none" stroke="#315347" stroke-width="2.3" stroke-linejoin="round"/>
    <text x="72" y="38" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#f5f6ec">CareRelay</text>
  </g>
  <text x="70" y="209" font-family="Georgia,serif" font-size="62" fill="#fafbf2">Keep care moving.</text>
  <text x="72" y="257" font-family="Arial,sans-serif" font-size="21" fill="#dbe4ce">Dialysis care. Accessible transport. One connected journey.</text>
  <rect x="72" y="303" width="361" height="42" rx="21" fill="#e7eedb"/>
  <text x="93" y="330" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#294b40">PATIENT → CARE TEAM → PROVIDERS</text>
