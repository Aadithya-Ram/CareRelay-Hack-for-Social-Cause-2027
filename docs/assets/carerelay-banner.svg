<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">CareRelay — Keep care moving.</title>
  <desc id="desc">Dialysis care, accessible transport, and people connected through one coordinated journey.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#183d35"/><stop offset="1" stop-color="#456754"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#c6d5a1" stop-opacity=".24"/><stop offset="1" stop-color="#c6d5a1" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>
  <circle cx="1030" cy="200" r="280" fill="url(#glow)"/>
  <g fill="none" stroke="#d9e6c1" stroke-opacity=".22">
    <ellipse cx="1050" cy="218" rx="200" ry="158" transform="rotate(-24 1050 218)"/>
    <ellipse cx="1050" cy="218" rx="200" ry="90" transform="rotate(32 1050 218)"/>
    <circle cx="1050" cy="218" r="118" stroke-dasharray="3 7"/>
  </g>
  <g transform="translate(70 66)">
